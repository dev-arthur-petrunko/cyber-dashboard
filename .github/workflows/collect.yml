name: Collect threat data

on:
  schedule:
    # Каждый час. Для 1 раза в день замени на: '0 6 * * *'
    - cron: "0 * * * *"
  workflow_dispatch: {}   # можно запускать вручную из вкладки Actions

# Не дозволяємо запланованому й ручному запуску одночасно записувати в Neon.
concurrency:
  group: threat-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Playwright і зовнішні API на холодному runner можуть працювати понад 15 хвилин.
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify Neon connection is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is required. Set it to the Neon PostgreSQL connection string."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run collectors
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: python -m app.pipeline
